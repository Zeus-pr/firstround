name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: firstround-space.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: firstround-space
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: firstround-space.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/firstround
  LOCAL_KEK_BASE64: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
  LOCAL_KEK_VERSION: '1'

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firstround
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test
      - name: Migrate database (twice for journal idempotency)
        run: |
          npm run db:migrate
          npm run db:migrate
      - run: npm run db:seed
      - run: npm run build
