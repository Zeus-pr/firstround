name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'
  NODE_OPTIONS: '--max-old-space-size=4096'
  NEXT_PUBLIC_FIREBASE_API_KEY: 'ci-placeholder'
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: 'firstround-space.firebaseapp.com'
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: 'firstround-space'
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: 'firstround-space.firebasestorage.app'
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  NEXT_PUBLIC_FIREBASE_APP_ID: '1:000000000000:web:ci'
  DATABASE_URL: 'postgres://postgres:postgres@localhost:5432/firstround'
  LOCAL_KEK_BASE64: 'MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI='
  LOCAL_KEK_VERSION: '1'

jobs:
  ci:
    name: format lint typecheck test migrate build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firstround
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d firstround"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Format
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Migrate (first pass)
        run: npm run db:migrate

      - name: Migrate (second pass, journal idempotent)
        run: npm run db:migrate

      - name: Seed
        run: npm run db:seed

      - name: Build
        run: npm run build
