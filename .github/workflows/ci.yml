name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-v2-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: 1
  TURBO_TELEMETRY_DISABLED: 1
  NODE_OPTIONS: --max-old-space-size=4096
  NEXT_PUBLIC_FIREBASE_API_KEY: ci-placeholder
  NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: firstround-space.firebaseapp.com
  NEXT_PUBLIC_FIREBASE_PROJECT_ID: firstround-space
  NEXT_PUBLIC_FIREBASE_STORAGE_BUCKET: firstround-space.firebasestorage.app
  NEXT_PUBLIC_FIREBASE_MESSAGING_SENDER_ID: '000000000000'
  NEXT_PUBLIC_FIREBASE_APP_ID: 1:000000000000:web:ci
  NEXT_PUBLIC_API_URL: http://127.0.0.1:4000
  DATABASE_URL: postgres://postgres:postgres@localhost:5432/firstround
  LOCAL_KEK_BASE64: MTIzNDU2Nzg5MDEyMzQ1Njc4OTAxMjM0NTY3ODkwMTI=
  LOCAL_KEK_VERSION: '1'
  WEB_ORIGIN: http://localhost:3000
  npm_config_store_dir: /tmp/pnpm-store
  npm_config_cache: /tmp/pnpm-cache

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: firstround
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.9
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run format:check
      - run: pnpm run lint
      - run: pnpm run typecheck
      - run: pnpm run test
      - name: Migrate + seed test database
        run: |
          pnpm run db:migrate
          pnpm run db:migrate
          pnpm run db:seed
      - run: pnpm run db:ci
      - run: pnpm run build
